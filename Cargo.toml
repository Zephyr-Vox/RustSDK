[workspace]
members = [
    "crates/zephyrvox-types",
    "crates/zephyrvox-wire",
    "crates/zephyrvox-http",
    "crates/zephyrvox-realtime",
    "crates/zephyrvox-voice",
    "crates/zephyrvox-sdk",
    "crates/zephyrvox-testkit",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"

[workspace.dependencies]
bytes = "1.12"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.18"
url = "2.5.8"
