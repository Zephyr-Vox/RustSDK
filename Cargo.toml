[workspace]
members = [
    "crates/zephyrvox-types",
    "crates/zephyrvox-wire",
    "crates/zephyrvox-http",
    "crates/zephyrvox-realtime",
    "crates/zephyrvox-voice",
    "crates/zephyrvox-sdk",
    "crates/zephyrvox-testkit",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"

[workspace.dependencies]
base64 = "0.22.1"
bytes = "1.12"
reqwest = { version = "0.12.24", default-features = false, features = [
    "http2",
    "json",
    "rustls-tls-native-roots",
] }
rustls = { version = "0.23.43", default-features = false, features = [
    "ring",
    "std",
    "tls12",
] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10.9"
thiserror = "2.0.18"
tokio = { version = "1.53", features = ["macros", "rt", "sync", "time"] }
url = "2.5.8"
